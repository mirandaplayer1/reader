<title>Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/*__CSS__*/
</style>

<div id="root" data-m="side" data-view="home">
  <header class="top">
    <h1><button id="gohome" aria-label="回到我的影片">Reader</button></h1>
    <span class="vt" id="vt"></span>
    <span class="pips" id="pips" title="內化進度"></span>
    <button class="sync" id="sync">僅存在這台裝置</button>
  </header>
  <div class="scroll" id="home"></div>
  <div class="panes">
    <section class="pane read">
      <div class="player"><div id="yt"></div>
        <a class="pfall" id="pfall" target="_blank" rel="noopener"><img alt="" id="pthumb" onerror="this.hidden=true"><span><b>在 YouTube 開啟影片 ↗</b><small id="pfmsg">影片載入中…</small></span></a>
      </div>
      <div class="rbar"><div class="seg3" role="group" aria-label="顯示語言"><button data-mode="zh">中</button><button data-mode="both">中英</button><button data-mode="en">EN</button></div><span class="sp" style="flex:1"></span><button class="mini" id="pmin">收起影片</button></div>
      <div class="scroll" id="rscroll"></div>
      <button class="tonow" id="tonow" hidden>▶ 回到播放位置</button>
    </section>
    <section class="pane side"><div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="拖曳調整左右欄寬度" tabindex="0"></div><div class="steps" id="steps" hidden></div><div class="scroll" id="side"></div></section>
  </div>
  <nav class="tabs" id="tabs"><button data-tab="overview">總覽</button><button data-tab="read">閱讀</button><button data-tab="distill">淬煉 <b id="n-d"></b></button><button data-tab="cards">觀點卡 <b id="n-c"></b></button></nav>
</div>
<div id="scrim" hidden></div><div id="sheet" hidden></div><div id="toast" hidden></div>

<script>
let VID="";
const THUMB="__THUMB__";
/*__DATA__*/
const CFG=/*__CFG__*/{};
/* The built-in sample. Videos you add are stored in the same shape. */
const DEMO={vid:"oFtjKbXKqbg",demo:true,lang:"en",title:"Pieter Levels: Programming, Viral AI Startups, and Digital Nomad Life",channel:"Lex Fridman Podcast #440",duration:13440,host:"L",speakers:{L:"Lex Fridman",P:"Pieter Levels"},
  thesis:"Pieter Levels 一個人做了 70 幾個產品，賺錢的只有 4 個。他不募資，想到就做，兩週內上線，有人刷卡才繼續。",
  tldr:["怎麼知道點子行不行：看有沒有陌生人付錢。註冊、按讚都不算。","多數點子會失敗，所以他一直做。有一年他每個月上線一個產品。","他只用 PHP、jQuery、SQLite，因為最熟。重複的事寫腳本處理，不請人。"],
  chapters:/*__CH__*/[],segs:DEMO_SEGS};
let V=null,SEGS=[],CH=[],THESIS="",TLDR=[];
const MAXC=3;

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>{const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=String(Math.floor(t%60)).padStart(2,"0");return h?`${h}:${String(m).padStart(2,"0")}:${s}`:`${m}:${s}`};
const yt=t=>`https://www.youtube.com/watch?v=${VID}&t=${t}s`;
const fmtDur=t=>{const h=Math.floor(t/3600),m=Math.round(t%3600/60);return (h?h+" 小時 ":"")+m+" 分"};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tlink=(t,label)=>`<a class="tlink" data-t="${t}" href="${yt(t)}" target="_blank" rel="noopener">${label||fmt(t)}</a>`;
let SENT={},TURNS=[];
/* Sentence ids are built from the turn's timestamp, so they survive re-chaptering.
   The bundled sample keeps its original ids. */
function indexContent(){SENT={};TURNS=[];const seen={};
  SEGS.forEach(g=>g.turns.forEach((tu,ti)=>{
    if(V.demo)tu._id=`${g.id}-${ti}`;else{const n=seen[tu.t]=(seen[tu.t]||0)+1;tu._id="t"+tu.t+(n>1?"."+n:"")}
    TURNS.push({t:tu.t,id:tu._id,seg:g.id});tu.s.forEach((p,si)=>{if(p)SENT[`${tu._id}-${si}`]={en:p[0],zh:p[1]||p[0],t:tu.t,seg:g,turn:tu}})}));
  TURNS.sort((a,b)=>a.t-b.t)}
/* Older notes used chapter-based ids (c3-12-0). Convert them once, while the chapters are still the same. */
function migrateIds(){if(!V||V.demo)return;let ch=false;
  const m=id=>{const r=/^c(\d+)-(\d+)-(\d+)$/.exec(id);if(!r)return id;const tu=SEGS[+r[1]]&&SEGS[+r[1]].turns[+r[2]];if(!tu)return id;ch=true;return `${tu._id}-${r[3]}`};
  for(const k of ["hl","notes"]){const o={};for(const id in S[k])o[m(id)]=S[k][id];S[k]=o}
  S.claims.forEach(c=>c.ev=(c.ev||[]).map(m));S.cards.forEach(c=>c.ev=(c.ev||[]).map(m));
  if(ch)commit()}
const isDeep=g=>g.deep!==false;
const keyIds=g=>(g.key||[]).map(([a,b])=>g.turns[a]?`${g.turns[a]._id}-${b}`:"").filter(id=>SENT[id]);
const who=tu=>(V.speakers&&V.speakers[tu.sp])||tu.sp;
const root=$("#root"),homeEl=$("#home"),sheetEl=$("#sheet"),scrimEl=$("#scrim"),toastEl=$("#toast"),side=$("#side"),rscroll=$("#rscroll");
let onSheetClose=null;
function openSheet(html,onClose){sheetEl.innerHTML=html;sheetEl.hidden=false;scrimEl.hidden=false;sheetEl.scrollTop=0;onSheetClose=onClose||null}
function closeSheet(){if(sheetEl.hidden)return;sheetEl.hidden=true;scrimEl.hidden=true;const f=onSheetClose;onSheetClose=null;f&&f()}
scrimEl.onclick=closeSheet;
let toastT;function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.hidden=true,1900)}
async function copyText(ta){try{await navigator.clipboard.writeText(ta.value);toast("已複製")}catch(e){ta.focus();ta.select();toast("已全選，請手動複製")}}

/* ---------- state: local first, cloud when available ---------- */
let LS="";
const blank=()=>({hl:{},notes:{},refl:{},claims:[],cards:[],mode:"both",at:0});
let S=blank();
function loadState(){LS="rd4:"+VID;S=blank();try{Object.assign(S,JSON.parse(localStorage.getItem(LS))||{})}catch(e){}}
const ui={side:"overview",m:"side",coreOnly:false,linkTo:null,fresh:null,open:new Set(),busy:{}};
let cloud=null,cloudBase=null,cloudOff=null,sb=null,sbUser=null,pushT=null,remoteWaiting=false;
const canSync=()=>!!(cloud||(sb&&sbUser));
const syncEl=$("#sync");
function badge(t,c){syncEl.textContent=t;syncEl.className="sync "+(c||"")}
function commit(){if(!VID)return;S.at=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} meta();if(canSync()){badge("同步中…");clearTimeout(pushT);pushT=setTimeout(push,900)}}
async function push(){if(!canSync())return;const at=S.at;try{
  if(cloud)await cloud.set({json:JSON.stringify(S),at});
  else{const {error}=await sb.from("reader_state").upsert({user_id:sbUser.id,video_id:VID,state:S,at});if(error)throw error}
  if(at===S.at)badge("已同步","ok")}catch(e){badge("同步失敗，內容仍在這台裝置","warn")}}
/* Supabase: used on the hosted site when src/config.json is filled in */
async function pull(){if(!sb||!sbUser||!VID)return;badge("同步中…");
  const {data,error}=await sb.from("reader_state").select("state,at").eq("video_id",VID).maybeSingle();
  if(error){badge("同步失敗，內容仍在這台裝置","warn");return}
  if(data&&data.at>S.at){adopt(JSON.stringify(data.state));badge("已同步","ok")}else if(S.at&&(!data||data.at<S.at))push();else badge("已同步","ok")}
function setUser(u){const was=sbUser&&sbUser.id;sbUser=u||null;if(!u){badge("登入","link");LIB=LIB.filter(x=>x.demo);renderHome();return}if(u.id!==was){badge("已登入","ok");pull();loadLibrary()}}
(async()=>{if(window.claude||!CFG.supabaseUrl||!CFG.supabaseAnonKey)return;try{
  await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  const {data}=await sb.auth.getSession();setUser(data.session&&data.session.user);
  sb.auth.onAuthStateChange((_e,ses)=>setUser(ses&&ses.user));
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
}catch(e){badge("同步服務載入失敗，內容仍在這台裝置","warn")}})();
const rateMsg=e=>(e&&(e.status===429||/rate limit/i.test(e.message||"")))?"寄信額度用完了：整個專案每小時只能寄幾封登入信。等一小時再試，或改用密碼登入。":null;
syncEl.onclick=()=>{if(!sb){if(!window.claude)toast("後端還沒接上");return}
  if(sbUser){openSheet(`<div class="eyebrow">帳號</div><p class="q-zh">已用 ${esc(sbUser.email||"")} 登入。</p>
    <p style="margin:0;color:var(--mute)">在任何裝置用同一個信箱登入，就會看到同一份影片和筆記。</p>
    <div class="eyebrow">設定密碼（之後換裝置不用收信）</div>
    <input type="password" id="sb-newpw" placeholder="至少 8 個字" autocomplete="new-password">
    <p id="sb-pwmsg" style="margin:0;color:var(--mute);font-size:15px">設定後，其他裝置輸入信箱和這組密碼就能登入。</p>
    <div class="row"><button class="btn line" id="sb-out">登出</button><span class="sp"></span><button class="btn" id="sb-setpw">儲存密碼</button></div>`);
    $("#sb-out").onclick=async()=>{await sb.auth.signOut();closeSheet()};
    $("#sb-setpw").onclick=async e=>{const b=e.currentTarget,pw=$("#sb-newpw").value;if(pw.length<8){$("#sb-pwmsg").textContent="密碼至少要 8 個字。";return}
      b.disabled=true;const {error}=await sb.auth.updateUser({password:pw});b.disabled=false;
      $("#sb-pwmsg").textContent=error?"沒有存成功："+error.message:"存好了。其他裝置用信箱加這組密碼登入，不用收信。";if(!error)$("#sb-newpw").value=""};
    return}
  openSheet(`<div class="eyebrow">登入</div><p class="q-zh">輸入信箱。有設定過密碼就一起填，沒有的話我們寄登入連結給你。</p>
    <input type="email" id="sb-mail" placeholder="you@example.com" autocomplete="email">
    <input type="password" id="sb-pw" placeholder="密碼（設定過才填）" autocomplete="current-password">
    <p id="sb-msg" style="margin:0;color:var(--mute);font-size:15px">在這台裝置上寫的東西登入後會保留。</p>
    <div class="row"><span class="sp"></span><button class="btn" id="sb-go">登入</button></div>`);
  $("#sb-go").onclick=async e=>{const b=e.currentTarget,mail=$("#sb-mail").value.trim(),pw=$("#sb-pw").value,msg=$("#sb-msg");if(!mail)return;b.disabled=true;
    if(pw){const {error}=await sb.auth.signInWithPassword({email:mail,password:pw});
      if(error){msg.textContent="登入失敗：信箱或密碼不對。還沒設定過密碼的話，把密碼欄清空，改收登入連結。";b.disabled=false}else closeSheet();return}
    const {error}=await sb.auth.signInWithOtp({email:mail,options:{emailRedirectTo:location.origin+location.pathname}});
    msg.textContent=error?(rateMsg(error)||"沒有寄出："+error.message):"寄出了。到信箱點連結，回到這一頁就會登入。連結一小時內有效，只能用一次。";if(error)b.disabled=false}};
function adopt(json){if(!VID)return;try{S=Object.assign(blank(),JSON.parse(json))}catch(e){return}try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  migrateIds();
  if(document.activeElement&&document.activeElement.tagName==="TEXTAREA"){remoteWaiting=true;return}if(root.dataset.view==="video")renderAll()}
document.addEventListener("focusout",()=>{if(remoteWaiting){remoteWaiting=false;setTimeout(()=>{if(!(document.activeElement&&document.activeElement.tagName==="TEXTAREA")&&root.dataset.view==="video")renderAll()},50)}});
function bindCloud(){
  if(cloudOff){try{cloudOff()}catch(e){} cloudOff=null}
  cloud=null;if(!cloudBase||!VID)return;
  cloud=cloudBase.doc("video-"+VID);badge("同步中…");
  const off=cloud.onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;
    if(!d){if(S.at)push();else badge("已同步","ok");return}
    if(d.at>S.at){adopt(d.json);badge("已同步","ok")}else if(d.at<S.at)push();else badge("已同步","ok");
  },()=>{badge("同步暫停，內容仍在這台裝置","warn")});
  if(typeof off==="function")cloudOff=off;
}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const [u,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
  const id=u&&await u.id();if(!db||!id)return;
  cloudBase=db.collection("data/users/"+id);bindCloud();
}catch(e){}})();

/* live Claude (optional): prewritten content is always on screen first */
let ask=null;
(async()=>{try{ask=await window.claude?.use?.("sample")}catch(e){} if(ask)document.body.classList.add("has-ai")})();
const AI_ERR={not_granted:"這個頁面沒有取得呼叫 Claude 的許可，這項功能先關閉。",rate_limited:"呼叫太頻繁，等一分鐘再試。",cancelled:""};
async function askAI(prompt,out,btn){
  if(!ask)return;out.hidden=false;out.textContent="思考中…";if(btn)btn.disabled=true;
  try{await ask(prompt,{modelTier:"quick",onText:({text})=>{out.textContent=text}})}
  catch(e){out.textContent=(e&&e.text)||AI_ERR[e&&e.code]||"這次沒有成功。其他內容不受影響，可以稍後再試。"}
  finally{if(btn)btn.disabled=false}
}

/* ---------- player ---------- */
let player=null,ytOK=false,tick=null,lastUserScroll=0,nowId=null;
function noYT(){if(ytOK)return;root.classList.add("no-yt");$("#pfmsg").textContent="這個頁面不能嵌入播放器。時間戳會在 YouTube 從那一秒開啟。"}
let ytLoading=false;
function initYT(){
  $("#pthumb").hidden=false;$("#pthumb").src=V.demo?THUMB:`https://i.ytimg.com/vi/${VID}/mqdefault.jpg`;$("#pfall").href=yt(CH[0]?CH[0].t:0);
  const start=SEGS[0]?SEGS[0].t:0;
  if(player&&ytOK){try{player.cueVideoById({videoId:VID,startSeconds:start})}catch(e){} return}
  if(ytLoading)return;ytLoading=true;
  window.onYouTubeIframeAPIReady=()=>{try{player=new YT.Player("yt",{videoId:VID,playerVars:{playsinline:1,rel:0,start},events:{
    onReady:()=>{ytOK=true;root.classList.remove("no-yt");root.classList.add("yt-ok")},
    onStateChange:e=>{clearInterval(tick);if(e.data===1)tick=setInterval(follow,500)},
    onError:()=>{if(!ytOK)noYT()}}})}catch(e){noYT()}};
  const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=noYT;document.head.appendChild(s);
  setTimeout(()=>{if(!ytOK)noYT()},9000);
}
function seek(t){if(!ytOK)return false;try{player.seekTo(t,true);player.playVideo()}catch(e){return false}root.classList.remove("p-min");$("#pmin").textContent="收起影片";return true}
let nowTurn=null;
function follow(){
  let cur;try{cur=player.getCurrentTime()}catch(e){return}
  let hit=null;for(const tu of TURNS){if(tu.t<=cur+.3)hit=tu;else break}
  const i=hit?TURNS.indexOf(hit):-1,next=TURNS[i+1];
  if(hit&&!(next&&next.t-hit.t<150?cur<next.t:cur<hit.t+90))hit=null;
  nowTurn=hit;const id=hit?hit.id:null;
  if(id!==nowId){nowId=id;
    $$(".turn.now",rscroll).forEach(e=>e.classList.remove("now"));
    const el=id&&$(`[data-turn="${id}"]`,rscroll);
    if(el){el.classList.add("now");if(Date.now()-lastUserScroll>4000)el.scrollIntoView({block:"center",behavior:"smooth"})}}
  showToNow();
}
/* The button appears whenever the line being played is off screen or inside a collapsed chapter. */
function showToNow(){
  const b=$("#tonow");if(!nowTurn){b.hidden=true;return}
  const el=$(`[data-turn="${nowTurn.id}"]`,rscroll);let off=true;
  if(el){const r=el.getBoundingClientRect(),v=rscroll.getBoundingClientRect();off=r.bottom<v.top+8||r.top>v.bottom-8}
  b.hidden=!off;
}
function goToNow(){
  if(!nowTurn)return;
  if(!$(`[data-turn="${nowTurn.id}"]`,rscroll)){ui.open.add(nowTurn.seg);renderRead()}
  const el=$(`[data-turn="${nowTurn.id}"]`,rscroll);if(!el)return;
  el.classList.add("now");nowId=nowTurn.id;lastUserScroll=0;el.scrollIntoView({block:"center",behavior:"smooth"});$("#tonow").hidden=true;
}
$("#tonow").onclick=goToNow;
rscroll.addEventListener("scroll",()=>{if(nowTurn)showToNow()},{passive:true});
["wheel","touchmove"].forEach(ev=>rscroll.addEventListener(ev,()=>lastUserScroll=Date.now(),{passive:true}));
$("#pmin").onclick=e=>{const m=root.classList.toggle("p-min");e.currentTarget.textContent=m?"顯示影片":"收起影片"};
document.addEventListener("click",e=>{const a=e.target.closest("a[data-t]");if(!a)return;if(seek(+a.dataset.t)){e.preventDefault();if(a.dataset.goread!=null)setTab("read");else if(ui.m!=="read")toast("從 "+fmt(+a.dataset.t)+" 播放中")}});

/* ---------- read ---------- */
const span=(id,lang)=>{const s=SENT[id];return `<span class="s${S.notes[id]?" has-note":""}" data-id="${id}" data-hl="${S.hl[id]||""}" role="button" tabindex="0">${esc(s[lang])}</span>`};
function renderRead(){
  const top=rscroll.scrollTop,mono=/^zh/i.test(V.lang||"");
  root.classList.toggle("mono",mono);
  rscroll.className="scroll m-"+S.mode;
  rscroll.innerHTML=`<div class="rin">`+SEGS.map((g,gi)=>{
    const deep=isDeep(g),hasZh=!deep&&g.turns.some(tu=>tu.s.some(p=>p&&p[1]&&p[1]!==p[0])),open=deep||hasZh||ui.open.has(g.id),busy=ui.busy[g.id];
    const body=!open?"":g.turns.map((tu,ti)=>{const ids=tu.s.map((p,si)=>p?`${tu._id}-${si}`:null);const line=l=>ids.map(id=>id?span(id,l):`<span class="gap">[…]</span>`).join(l==="en"?" ":"");
      return `<div class="turn sp-${tu.sp===V.host?"L":"P"}" data-turn="${tu._id}"><div class="who"><b>${esc(who(tu)).toUpperCase()}</b>${tlink(tu.t)}</div><p class="zh">${line("zh")}</p><p class="en">${line("en")}</p></div>`}).join("");
    const tools=deep?"":`<div class="row segtools">${open?"":`<button class="btn sm line" data-open="${g.id}">顯示原文</button>`}<button class="btn sm" data-deepen="${gi}" ${busy?"disabled":""}>${busy?esc(busy):hasZh?"補上摘要和第一性原理":"精讀這一章（翻譯＋第一性原理）"}</button></div>`;
    const absorb=!deep?"":`<div class="absorb">
      <div class="eyebrow">這一段在說什麼</div><ul>${(g.sum||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="eyebrow">第一性原理</div><p class="core">${esc(g.core)}</p>
      <details><summary>展開推理鏈（${(g.chain||[]).length} 步）</summary><ol class="chain">${(g.chain||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>
      <div class="eyebrow">換到你身上</div><p class="ask">${esc(g.ask)}</p>
      <textarea id="refl-${g.id}" data-refl="${g.id}" placeholder="寫一兩句就好">${esc(S.refl[g.id]||"")}</textarea>
    </div>`;
    return `<section class="a-seg${deep||hasZh?"":" raw"}" id="seg-${g.id}">
    <header><i>第 ${gi+1} 段，共 ${SEGS.length} 段</i><h3>${esc(g.title)}</h3>${tlink(g.t)}</header>${tools}${body}${absorb}</section>`}).join("")+`</div>`;
  rscroll.scrollTop=top;nowId=null;
  $$("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
}
function markSent(id){$$(`.s[data-id="${id}"]`,rscroll).forEach(e=>{e.dataset.hl=S.hl[id]||"";e.classList.toggle("has-note",!!S.notes[id])})}
function sentSheet(id){
  const s=SENT[id];$$(`.s[data-id="${id}"]`,rscroll).forEach(e=>e.classList.add("on"));
  openSheet(`<p class="q-zh">${esc(s.zh)}</p>${s.zh===s.en?"":`<p class="q-en">${esc(s.en)}</p>`}
    <div class="hl-row">${[["y","洞見","var(--hl-y)"],["p","疑問","var(--hl-p)"],["g","要去做","var(--hl-g)"],["","不畫","transparent"]].map(([k,l,c])=>`<button data-hl="${k}" aria-pressed="${(S.hl[id]||"")===k}"><i style="background:${c}"></i>${l}</button>`).join("")}</div>
    <textarea id="a-note" placeholder="這句讓你想到什麼？">${esc(S.notes[id]||"")}</textarea>
    <div class="ai-out" id="a-aiout" hidden></div>

function setLib(vid,patch){let it=LIB.find(x=>x.video_id===vid&&!x.demo);if(!it){it={video_id:vid,title:"",status:"queued"};LIB.splice(1,0,it)}Object.assign(it,patch);if(root.dataset.view==="home")renderHome()}
async function loadLibrary(){if(!canIngest())return;
  const {data,error}=await sb.from("videos").select("video_id,title,status,progress,error,updated_at").order("updated_at",{ascending:false});
  if(error)return;LIB=[LIB.find(x=>x.demo),...data];renderHome();
  data.filter(v=>v.status==="queued"||v.status==="processing").forEach(v=>drive(v.video_id));
}
async function fn(body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return {error:"登入已過期，請重新登入。",fatal:true};
  let r;try{r=await fetch(CFG.supabaseUrl+"/functions/v1/ingest",{method:"POST",headers:{"content-type":"application/json",apikey:CFG.supabaseAnonKey,Authorization:"Bearer "+session.access_token},body:JSON.stringify(body)})}
  catch(e){return {error:"連不上後端，檢查網路後會自動重試。",httpStatus:0}}
  const j=await r.json().catch(()=>({}));if(!r.ok&&!j.error)j.error="後端沒有回應（"+r.status+"）";j.httpStatus=r.status;return j;
}
/* Keeps asking the backend for the next unit until the video is ready. Safe to call again at any time:
   the server remembers what is done, so a reload or a failed unit resumes from where it stopped. */
async function drive(vid){
  if(driving.has(vid))return;driving.add(vid);let fails=0;
  try{while(true){
    const j=await fn({action:"step",video_id:vid});
    if(j.error){fails++;if(j.fatal||fails>=4){setLib(vid,{status:"error",error:j.error,note:""});break}
      setLib(vid,{note:`遇到問題，第 ${fails} 次重試中：${j.error}`});await sleep(j.httpStatus===429?20000:3000*fails);continue}
    fails=0;setLib(vid,{title:j.title,status:j.status,progress:j.progress,error:j.error,note:""});
    if(j.busy){await sleep(4000);continue}
    if(j.status==="ready"){delete cache[vid];toast("處理完成："+(j.title||vid));break}
    if(j.status==="error")break;
  }}finally{driving.delete(vid)}
}
async function addVideo(url){
  const msg=$("#add-msg");
  if(!/(youtube\.com|youtu\.be)/.test(url)){msg.textContent="請貼上 YouTube 影片的網址。";return}
  if(!canIngest()){msg.textContent="先登入才能加入影片。";syncEl.click();return}
  msg.textContent="加入中…";const j=await fn({action:"start",url});
  if(j.error){msg.textContent="沒有加入："+j.error;return}
  msg.textContent="";$("#add-url").value="";setLib(j.video_id,j);
  if(j.status!=="ready")drive(j.video_id);
}
async function deepen(k){
  const g=SEGS[k];if(!g||isDeep(g)||ui.busy[g.id])return;
  if(V.demo||!canIngest()){toast("這一章要在部署版登入後才能精讀");return}
  const vid=VID,show=t=>{ui.busy[g.id]=t;if(VID===vid){renderRead();if(ui.side==="overview")renderOverview()}};
  show("準備中…");let fails=0;
  while(true){
    const j=await fn({action:"deepen",video_id:vid,chapter:k});
    if(j.error){fails++;if(j.fatal||fails>=4){delete ui.busy[g.id];if(VID===vid){renderRead();renderSide()}toast("精讀沒有完成："+j.error);return}
      show(`重試中（${fails}）…`);await sleep(j.httpStatus===429?20000:3000*fails);continue}
    fails=0;if(j.busy){await sleep(3000);continue}
    if(j.done)break;
    show(j.progress?`翻譯中 ${j.progress.done}/${j.progress.total} 句`:"處理中…");
  }
  delete ui.busy[g.id];delete cache[vid];
  const c=await fetchContent(vid);
  if(c&&VID===vid){V=c;SEGS=c.segs;CH=c.chapters;indexContent();renderAll();toast("這一章精讀好了")}
}
async function reprocess(mode){
  if(!canIngest()){toast("先登入才能重新處理");return}
  const vid=VID,title=V.title;
  openSheet(`<div class="eyebrow">重新處理</div><p class="q-zh">${mode==="all"?"整支重跑":"只重做章節和摘要"}：${esc(title)}</p>
    <p style="margin:0;color:var(--mute)">${mode==="all"?"會從影片重新讀起。處理完之前這支影片先不能打開。":"逐字稿和翻譯會留著。處理完之前這支影片先不能打開。"}</p>
    <div class="row"><span class="sp"></span><button class="btn line" id="rp-no">取消</button><button class="btn" id="rp-go">開始</button></div>`);
  $("#rp-no").onclick=closeSheet;
  $("#rp-go").onclick=async e=>{e.currentTarget.disabled=true;
    const j=await fn({action:"reprocess",video_id:vid,mode});
    if(j.error){closeSheet();toast("沒有開始："+j.error);return}
    closeSheet();delete cache[vid];goHome();setLib(vid,{title:j.title||title,status:j.status,progress:j.progress,error:null,note:""});drive(vid)};
}
async function fetchContent(vid){
  if(cache[vid])return cache[vid];
  const {data,error}=await sb.from("videos").select("content").eq("video_id",vid).maybeSingle();
  if(error||!data||!data.content)return null;
  return cache[vid]=data.content;
}
const STEP={meta:"讀取影片資訊",transcribe:"讀影片內容",outline:"整理章節和摘要",synth:"寫整支影片的總覽",ready:"完成"};
function statusLine(it){
  if(it.demo)return "範例 · 只有 5 段節錄";
  if(it.status==="ready")return "可以閱讀";
  if(it.status==="error")return "沒有完成："+(it.error||"未知的問題");
  if(it.note)return it.note;
  const p=it.progress||{};
  if(p.phase==="transcribe")return p.total?`正在讀影片內容，${p.done||0} / ${p.total} 段（每段 5 分鐘）`:`正在讀影片內容，已完成 ${p.done||0} 段（每段 5 分鐘）`;
  if(p.phase==="outline"&&p.total>1)return `正在整理章節和摘要，${p.done||0} / ${p.total}`;
  return "正在"+(STEP[p.phase]||"排隊")+"…";
}
function renderHome(){
  const why=window.claude?"這個預覽頁不能處理新影片，也不能嵌入播放器（平台會擋）。部署版才有這兩項。"
    :!(CFG.supabaseUrl&&CFG.supabaseAnonKey)?"後端還沒接上，目前只能看範例。"
    :!sbUser?"先登入，才能加入影片並跨裝置同步。":"";
  const keep=$("#add-url")?$("#add-url").value:"";
  homeEl.innerHTML=`<div class="pad home">
    <div><h2>把看過的影片變成自己的觀點</h2><p class="meta">貼上網址，先看摘要決定值不值得細看，再精讀、畫線、淬煉成最多三張觀點卡。</p></div>
    <form id="add" class="add"><input id="add-url" type="url" inputmode="url" placeholder="貼上 YouTube 網址" ${canIngest()?"":"disabled"}><button class="btn" ${canIngest()?"":"disabled"}>加入</button></form>
    <p class="meta" id="add-msg">${why}</p>
    ${!window.claude&&sb&&!sbUser?`<div><button class="btn" id="home-login">登入</button></div>`:""}
    <div class="eyebrow">我的影片</div>
    <div class="lib">${LIB.filter(it=>!(it.demo&&LIB.some(x=>!x.demo&&x.video_id===it.video_id))).map(it=>`<button class="item${it.status==="ready"?"":" wait"}" data-vid="${it.video_id}" data-status="${it.status}"${it.demo?" data-demo":""}>
      <img alt="" src="${it.demo?THUMB:`https://i.ytimg.com/vi/${it.video_id}/mqdefault.jpg`}" onerror="this.style.visibility='hidden'">
      <span><b>${esc(it.title||"（讀取中）"+it.video_id)}</b><small class="${it.status==="error"?"err":""}">${esc(statusLine(it))}</small>${it.status==="error"?`<em>點這裡從中斷的地方重試</em>`:""}</span></button>`).join("")}</div>
  </div>`;
  if(keep)$("#add-url").value=keep;
  $("#add").onsubmit=e=>{e.preventDefault();addVideo($("#add-url").value.trim())};
  const hl=$("#home-login");if(hl)hl.onclick=()=>syncEl.click();
}
homeEl.addEventListener("click",async e=>{
  const b=e.target.closest("[data-vid]");if(!b)return;const vid=b.dataset.vid,st=b.dataset.status;
  if(b.dataset.demo!=null){openVideo(DEMO);return}
  if(st==="error"){setLib(vid,{status:"processing",error:null,note:"重新開始…"});drive(vid);return}
  if(st!=="ready"){toast("還在處理中，完成後會通知你");return}
  const c=await fetchContent(vid);if(!c){toast("讀不到這支影片的內容，請稍後再試");return}
  openVideo(c);
});
function openVideo(c){
  V=c;VID=c.vid;SEGS=c.segs||[];CH=c.chapters||[];THESIS=c.thesis||"";TLDR=c.tldr||[];
  indexContent();loadState();migrateIds();bindCloud();pull();
  $("#vt").textContent=c.title+(c.channel?" · "+c.channel:"");
  ui.side="overview";ui.m="side";ui.linkTo=null;ui.open=new Set();
  root.dataset.view="video";renderAll();initYT();rscroll.scrollTop=0;side.scrollTop=0;
}
function goHome(){closeSheet();try{if(player&&ytOK)player.pauseVideo()}catch(e){} root.dataset.view="home";$("#vt").textContent="";renderHome()}
$("#gohome").onclick=goHome;
/* wide screens: drag the divider to resize the two columns; double-click to reset */
(function(){
  const split=$("#split"),KEY="rd4:side-w",clamp=w=>Math.max(340,Math.min(innerWidth-420,w));
  const apply=w=>{root.style.setProperty("--side-w",clamp(w)+"px")};
  try{const w=+localStorage.getItem(KEY);if(w)apply(w)}catch(e){}
  let on=false;
  split.addEventListener("pointerdown",e=>{on=true;split.setPointerCapture(e.pointerId);document.body.classList.add("resizing");e.preventDefault()});
  split.addEventListener("pointermove",e=>{if(on)apply(innerWidth-e.clientX)});
  const end=()=>{if(!on)return;on=false;document.body.classList.remove("resizing");
    try{localStorage.setItem(KEY,parseInt(getComputedStyle(root).getPropertyValue("--side-w"))||"")}catch(e){}
    if(ui.side==="distill"&&root.dataset.view==="video")layoutDistill()};
  split.addEventListener("pointerup",end);split.addEventListener("pointercancel",end);
  split.addEventListener("dblclick",()=>{root.style.removeProperty("--side-w");try{localStorage.removeItem(KEY)}catch(e){} if(ui.side==="distill"&&root.dataset.view==="video")layoutDistill()});
  split.addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;const cur=parseInt(getComputedStyle(root).getPropertyValue("--side-w"))||520;apply(cur+(e.key==="ArrowLeft"?24:-24));end.call(null);try{localStorage.setItem(KEY,clamp(cur+(e.key==="ArrowLeft"?24:-24)))}catch(x){}});
  addEventListener("resize",()=>{const cur=parseInt(getComputedStyle(root).getPropertyValue("--side-w"));if(cur)apply(cur)});
})();
renderHome();
</script>
