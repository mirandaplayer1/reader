<title>Reader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one full-height app. Phone: one pane at a time behind a bottom tab bar. Wide: player + transcript left, overview / distill / cards right.
   Look: a Notion-like document. White page, warm-grey ink, one sans family, hairline dividers, small radii, grey callouts, soft background-colour highlights. */
:root{
  --bg:#FFFFFF; --surf:#FFFFFF; --surf2:#F7F6F3; --hover:rgba(55,53,47,.08); --ink:#37352F; --mute:#787774; --line:rgba(55,53,47,.12);
  --acc:#2383E2; --grow:#2383E2; --warn:#D9730D; --on-acc:#FFFFFF;
  --hl-y:#FAECB8; --hl-p:#F7DCE7; --hl-g:#D7EBDA; --edge-y:#DFAB01; --edge-p:#D15796; --edge-g:#4DAB6F;
  --tag-y:#FDECC8; --tag-g:#E3E2E0; --scrim:rgba(15,15,15,.4);
  --f-b:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#191919; --surf:#202020; --surf2:#252525; --hover:rgba(255,255,255,.06); --ink:rgba(255,255,255,.84); --mute:rgba(255,255,255,.48); --line:rgba(255,255,255,.1);
  --acc:#5A9FE8; --grow:#5A9FE8; --warn:#E89A52; --on-acc:#FFFFFF;
  --hl-y:#56472A; --hl-p:#52303F; --hl-g:#28402F; --tag-y:#56472A; --tag-g:#373737; --scrim:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#191919; --surf:#202020; --surf2:#252525; --hover:rgba(255,255,255,.06); --ink:rgba(255,255,255,.84); --mute:rgba(255,255,255,.48); --line:rgba(255,255,255,.1);
  --acc:#5A9FE8; --grow:#5A9FE8; --warn:#E89A52; --on-acc:#FFFFFF;
  --hl-y:#56472A; --hl-p:#52303F; --hl-g:#28402F; --tag-y:#56472A; --tag-g:#373737; --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
textarea,input[type=email]{width:100%;border:1px solid var(--line);background:var(--surf2);border-radius:6px;padding:12px 14px;font-size:17px;line-height:1.6;resize:none}
textarea{min-height:92px} textarea.big{min-height:230px}
textarea:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
::placeholder{color:var(--mute);opacity:.75}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:6px;font-weight:500;font-size:15.5px;background:var(--acc);color:var(--on-acc);text-decoration:none;transition:filter .12s}
.btn:hover{filter:brightness(.94)} .btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost,.btn.line{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)} .btn.ghost:hover,.btn.line:hover{background:var(--hover);filter:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:14.5px;border-radius:5px}
.eyebrow{font-size:14px;font-weight:500;color:var(--mute)}
.ai-only{display:none!important} body.has-ai .ai-only{display:inline-flex!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .row .sp{flex:1}
.tlink{font-size:14px;color:var(--mute);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tlink:hover{color:var(--ink)}

#root{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;font-weight:700;margin:0;line-height:1}
.top .vt{flex:1;min-width:0;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:4px} .pips i{width:7px;height:7px;border-radius:50%;background:var(--line)} .pips i.on{background:var(--acc)}
.sync{font-size:13px;color:var(--mute);white-space:nowrap} .sync.warn{color:var(--warn)} .sync.link{color:var(--acc)}
.panes{flex:1;min-height:0;display:flex}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
#root[data-m="read"] .pane.side,#root[data-m="side"] .pane.read{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tabs{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:13px 4px 14px;font-size:15px;color:var(--mute)}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:700}
.tabs b{font-weight:400;font-size:13px;font-variant-numeric:tabular-nums;color:var(--mute)}
@media (min-width:980px){
  #root[data-m] .pane.read,#root[data-m] .pane.side{display:flex}
  .pane.read{flex:1.3;border-right:1px solid var(--line)} .pane.side{max-width:520px}
  .tabs{order:1;align-self:flex-end;width:520px;border-top:0;border-bottom:1px solid var(--line)}
  .tabs [data-tab="read"]{display:none}
  .panes{order:2}
  .rin{max-width:720px;margin:0 auto}
}

/* player */
.player{flex:none;background:#000;width:100%;aspect-ratio:16/9;max-height:36vh;position:relative}
.player iframe,.player #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.pfall{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surf2);text-decoration:none}
.pfall img{height:100%;max-height:72px;aspect-ratio:16/9;object-fit:cover;border-radius:4px}
.pfall b{display:block;font-size:15.5px;font-weight:500;line-height:1.35} .pfall small{color:var(--mute);font-size:13.5px;line-height:1.45;display:block}
#root.no-yt .player{aspect-ratio:auto;height:100px;background:var(--surf2)}
#root.yt-ok .pfall{display:none}
#root.p-min.yt-ok .player{height:0;aspect-ratio:auto;overflow:hidden}
.rbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 18px;border-bottom:1px solid var(--line)}
.seg3{display:inline-flex;background:var(--surf2);border-radius:6px;padding:2px}
.seg3 button{padding:4px 13px;border-radius:4px;font-size:14px;color:var(--mute)}
.seg3 button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.rbar .mini{font-size:14px;color:var(--mute)} #root.no-yt .rbar .mini{display:none}

/* transcript */
.rin{padding:0 22px 72px}
.a-seg{padding-top:44px}
.a-seg>header{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;margin-bottom:10px}
.a-seg>header h3{font-size:30px;font-weight:700;margin:0;line-height:1.3;grid-column:1}
.a-seg>header i{font-style:normal;font-size:14px;color:var(--mute);grid-column:1/-1}
.turn{padding:12px 0 12px 14px;border-left:3px solid transparent;margin-left:-17px}
.turn.now{border-left-color:var(--acc)}
.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.who b{font-size:13.5px;font-weight:500;color:var(--mute)}
.turn p{margin:0} .turn .zh{font-size:19px;line-height:1.85}
.turn .en{font-size:19px;line-height:1.6;color:var(--mute);margin-top:10px}
.sp-L .zh{font-size:17.5px;color:var(--mute)} .sp-L .en{font-size:18px}
.m-zh .turn .en,.m-en .turn .zh{display:none} .m-en .turn .en{color:var(--ink);font-size:20px;margin-top:0}
.s{cursor:pointer;border-radius:3px;padding:2px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .15s}
.s:hover{background:var(--hover)}
.s[data-hl="y"]{background:var(--hl-y)} .s[data-hl="p"]{background:var(--hl-p)} .s[data-hl="g"]{background:var(--hl-g)}
.s[data-hl="y"],.s[data-hl="p"],.s[data-hl="g"]{color:var(--ink)}
.s.on{box-shadow:0 2px 0 var(--acc)} .s.has-note::after{content:"✎";font-size:12px;color:var(--acc);margin-left:2px;vertical-align:super}
.gap{color:var(--mute);opacity:.6}
.absorb{margin-top:22px;background:var(--surf2);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:8px}
.absorb .eyebrow:not(:first-child){margin-top:14px}
.absorb ul,.ov ul{margin:0;padding-left:1.2em;font-size:16.5px} .absorb li+li,.ov li+li{margin-top:5px}
.core{font-size:20px;font-weight:700;line-height:1.55;margin:0}
.chain{list-style:none;margin:10px 0 0;padding:0;counter-reset:c;display:grid;gap:10px}
.chain li{counter-increment:c;padding-left:26px;position:relative;font-size:16px}
.chain li::before{content:counter(c) ".";position:absolute;left:0;top:0;color:var(--mute);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-size:15px;color:var(--mute);padding:2px 0}
details summary:hover{color:var(--ink)}
.ask{font-weight:700;margin:0;font-size:17px}
.absorb textarea{background:var(--bg)}

/* sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
#sheet{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,560px);bottom:0;z-index:21;background:var(--bg);border-radius:12px 12px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:86%;overflow-y:auto;box-shadow:0 0 0 1px var(--line),0 -12px 40px rgba(15,15,15,.14);animation:up .18s ease-out;display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#37352F;color:#fff;padding:8px 14px;border-radius:6px;font-size:14.5px;z-index:30;white-space:nowrap}
.q-zh{font-size:19px;font-weight:500;margin:0;line-height:1.7}
.q-en{font-size:19px;color:var(--mute);margin:0;line-height:1.55}
.ai-out{background:var(--surf2);border-radius:6px;padding:12px 14px;font-size:16px;white-space:pre-wrap}
.ai-out::before{content:"Claude";display:block;font-size:13px;color:var(--mute)}
.hl-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hl-row button{padding:10px 4px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hl-row button:hover{background:var(--hover)}
.hl-row button i{width:28px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line)}
.hl-row button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--acc);font-weight:700}
.counter{background:var(--surf2);border-radius:6px;padding:12px 14px;font-size:16px}
.counter b{display:block;font-size:13.5px;font-weight:500;color:var(--warn)}
.linked{display:grid;gap:2px} .linked>*{display:flex;gap:8px;align-items:center;border-radius:5px;padding:8px 10px;font-size:15.5px;text-align:left;width:100%;background:var(--surf2)}
.linked span{flex:1} .linked .x{color:var(--mute);font-size:16px;width:24px;flex:none;text-align:center}
.linked [aria-pressed="true"]{background:var(--hl-g)}

/* overview */
.pad{padding:28px 22px 72px;display:flex;flex-direction:column;gap:16px}
.pad h2{font-size:30px;font-weight:700;margin:2px 0 0;line-height:1.3;text-wrap:balance}
.ov h2{font-weight:400;font-size:16px;color:var(--mute);margin:0}
.thesis{font-size:25px;font-weight:700;line-height:1.5;margin:0;text-wrap:pretty}
.ov .meta{color:var(--mute);font-size:14.5px;margin:0}
.chips{display:inline-flex;background:var(--surf2);border-radius:6px;padding:2px} .chips button{padding:4px 12px;border-radius:4px;font-size:14px;color:var(--mute)} .chips button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chs{display:grid}
.ch{border-top:1px solid var(--line);padding:16px 0;display:grid;gap:5px}
.ch header{display:flex;align-items:baseline;gap:10px}
.ch header b{flex:1;font-weight:700;font-size:18.5px;line-height:1.4} .ch header small{color:var(--mute);font-size:14px;font-weight:400;display:block}
.ch p{margin:0;font-size:16px;color:var(--mute);line-height:1.65}
.ch .take{color:var(--ink)}
.w{flex:none;font-size:13px;padding:1px 7px;border-radius:3px;background:var(--tag-g);color:var(--ink);white-space:nowrap}
.w.w3{background:var(--tag-y)} .w.w1{background:none;color:var(--mute);padding:1px 0}
.ch .row{margin-top:6px}
.ch.w1 header b{color:var(--mute);font-weight:500}

/* distill */
.steps{flex:none;display:flex;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute);overflow-x:auto;white-space:nowrap}
.steps span.on{color:var(--ink);font-weight:700}
.dmap{position:relative;padding:14px 16px 60px;display:grid;grid-template-columns:46% 1fr;gap:0 8%}
.dmap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dmap path{fill:none;stroke:var(--acc);stroke-width:1.3;opacity:.55}
.dcol{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.dlab{font-weight:700;font-size:15.5px;margin-top:14px}
.spark{text-align:left;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);border-left:4px solid var(--line);border-radius:5px;padding:8px 10px;font-size:15px;line-height:1.5;display:block;width:100%}
.spark:hover{background:var(--surf2)}
.spark span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spark small{display:block;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.spark[data-hl="y"]{border-left-color:var(--edge-y)} .spark[data-hl="p"]{border-left-color:var(--edge-p)} .spark[data-hl="g"]{border-left-color:var(--edge-g)}
.spark.used{box-shadow:inset 0 0 0 1px var(--acc)} .spark.pick{background:var(--hl-g)}
.dright{position:relative;z-index:1}
.claim{position:absolute;left:0;right:0;text-align:left;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--acc);border-radius:6px;padding:10px 12px;font-size:16px;font-weight:700;line-height:1.5}
.claim.lv2{box-shadow:inset 0 0 0 2px var(--acc)} .claim.lv3{background:var(--acc);color:var(--on-acc)}
.claim.carded{background:var(--hl-y);color:var(--ink);box-shadow:none}
.claim small{display:block;font-size:12.5px;font-weight:400;opacity:.75}
.claim.pick{outline:2px solid var(--ink);outline-offset:3px}
.dempty{position:absolute;left:0;right:0;top:34px;border:1px dashed var(--line);border-radius:6px;padding:16px 12px;color:var(--mute);font-size:15px;text-align:center}
.banner{position:sticky;top:8px;z-index:3;margin:8px 16px 0;background:#37352F;color:#fff;border-radius:6px;padding:8px 8px 8px 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.banner span{flex:1}

/* cards */
.vcard{background:var(--bg);box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(15,15,15,.05);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:12px}
.vcard p{margin:0;font-size:24px;font-weight:700;line-height:1.5;text-wrap:pretty}
.vcard .ev{font-size:16.5px;line-height:1.5;color:var(--mute);border-left:3px solid var(--ink);padding-left:12px}
.vcard .tag{font-size:13px;padding:1px 7px;border-radius:3px;background:var(--tag-y)}
.vcard button{font-size:13.5px;color:var(--mute)} .vcard button:hover{color:var(--ink)}
.vcard.mint{animation:mint .4s ease-out}
@keyframes mint{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.slot{border:1px dashed var(--line);border-radius:8px;padding:22px;color:var(--mute);text-align:center;font-size:15px}
.ncard{border-left:3px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px;font-size:16px}
.ncard[data-hl="y"]{border-left-color:var(--edge-y)} .ncard[data-hl="p"]{border-left-color:var(--edge-p)} .ncard[data-hl="g"]{border-left-color:var(--edge-g)}
.ncard .mine{font-weight:700} .ncard small{color:var(--mute);font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Paris 2024 colour layer, sampled from the reference photos:
   lavender track #A4ADE6 / #9390D7, indigo ground #3A4083, lane-marker orange #EFAA59,
   baton yellow, raspberry, pink, green, teal. Lavender is the ground; the vivid colours stay small, like objects on the track. ---------- */
:root{
  --lav:#9390D7; --lav-2:#A4ADE6; --lav-l:#ECEDFA; --indigo:#3A4083; --navy:#202762; --cone:#F09A3E;
  --b-yellow:#E3C234; --b-rasp:#CF4A6E; --b-pink:#F1ABC9; --b-green:#4FA574; --b-teal:#49B3B3;
  --acc:var(--indigo); --grow:var(--lav); --link:#5A5CC4; --warn:var(--b-rasp); --on-acc:#FFFFFF;
  --hl-y:#F8EDB4; --hl-p:#FADCE9; --hl-g:#CFEBDD; --edge-y:var(--b-yellow); --edge-p:var(--b-pink); --edge-g:var(--b-green); --tag-y:#F8EDB4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --lav-l:#26284A; --acc:var(--lav-2); --link:#A4ADE6; --on-acc:#14163A;
  --hl-y:#4C431C; --hl-p:#4E2A3C; --hl-g:#1F4031; --tag-y:#4C431C } }
:root[data-theme="dark"]{
  --lav-l:#26284A; --acc:var(--lav-2); --link:#A4ADE6; --on-acc:#14163A;
  --hl-y:#4C431C; --hl-p:#4E2A3C; --hl-g:#1F4031; --tag-y:#4C431C }

/* header = a strip of track: lavender with white lane lines */
.top{border-bottom:0;background:#96723F;color:#fff;padding-bottom:16px;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.9) 0 1px,transparent 1px 4px)}
.top .vt{color:rgba(255,255,255,.88)} .top .sync,.top .sync.link,.top .sync.warn{color:#fff}
.pips i{background:rgba(255,255,255,.4)} .pips i.on{background:#fff}

/* each segment gets a lane-marker number */
.rin{counter-reset:seg}
.a-seg{counter-increment:seg}
.a-seg>header i{display:flex;align-items:center;gap:8px}
.a-seg>header i::before{content:counter(seg);display:grid;place-items:center;width:26px;height:26px;border-radius:5px 5px 2px 2px;background:var(--cone);color:#fff;font-weight:700;font-size:15px}
.a-seg .turn.now{border-left-color:var(--cone)}
.a-seg .absorb{background:var(--lav-l)}
.a-seg .chain li::before{color:var(--link);font-weight:700}
.thesis{border-left:5px solid var(--cone);padding-left:16px}
.tlink:hover,details summary:hover{color:var(--link)}
.s.on{box-shadow:0 2px 0 var(--lav)} .s.has-note::after{color:var(--link)}
.tabs button[aria-pressed="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--lav)}
.steps span.on{color:var(--acc)}
.hl-row button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--lav)}
textarea:focus,input:focus{border-color:var(--lav);box-shadow:0 0 0 3px color-mix(in srgb,var(--lav) 28%,transparent)}

/* distill */
.dmap path{stroke:var(--lav);opacity:.9}
.claim{box-shadow:inset 0 0 0 1px var(--lav)} .claim.lv2{box-shadow:inset 0 0 0 2px var(--lav)} .claim.lv3{background:var(--lav);color:#fff}
.claim.carded{background:var(--indigo);color:#fff;box-shadow:none}
.spark.used{box-shadow:inset 0 0 0 1px var(--lav)}
.spark:not([data-hl="y"]):not([data-hl="p"]):not([data-hl="g"]){border-left-color:var(--lav)}
.spark.pick,.linked [aria-pressed="true"]{background:var(--lav-l)}

/* viewpoint cards = batons on the indigo ground */
.vcard{background:var(--indigo);color:#fff;box-shadow:none;border-left:8px solid var(--b-yellow)}

 turns:[
 {sp:"L",t:123,s:[["You’ve launched a lot of companies and built a lot of products.","你推出過很多公司、做過很多產品。"],["As you say, most failed, but some succeeded.","就像你說的，大部分失敗了，但有些成功。"],["What’s your philosophy behind building the startups that you did?","你做這些新創，背後的哲學是什麼？"]]},
 {sp:"P",t:134,s:[["I think my philosophy is very different than most people in startups, because most people in startups, they build a company and they raise money and they hire people and then they build a product and they find something that makes money.","我的哲學跟大多數做新創的人很不一樣。多數人是先開公司、募資、請人，然後做產品，再去找能賺錢的東西。"],["And I don’t really raise money. I don’t use VC funding, I do everything myself.","我不募資，不拿創投的錢，所有事都自己來。"],["I’m a designer, I’m the developer, I make everything, I make the logo.","我是設計師、也是工程師，什麼都自己做，連 logo 也是。"],["So for me, I’m much more scrappy. And because I don’t have funding, I need to go fast. I need to make things fast to see if an idea works.","所以我的做法土砲得多。因為沒有資金，我必須快，必須很快把東西做出來，才知道點子行不行。"],["I have an idea in my mind and I build it like a mini startup, and I launch it very quickly, within two weeks or something, of building it.","我腦中有個點子，就把它當成迷你新創來做，大概兩週內就上線。"],["And I check if there’s demand and if people actually sign up and not just sign up, but if people actually pay money.","然後我看有沒有需求：有沒有人真的註冊。而且不只是註冊，是有沒有人真的付錢。"],["They need to take out their credit cards, pay me money, and then I can see if the idea is validated.","他們得掏出信用卡、付錢給我，我才算驗證了這個點子。"],["And most ideas don’t work, as you say, most fail.","而大多數點子行不通。就像你說的，多數會失敗。"]]},
 {sp:"P",t:202,s:[["Yeah. I think it’s very rapid.","對，我覺得非常快。"],["If I compare it to, for example, Google or big tech companies, especially Google right now is struggling.","拿 Google 這類大公司來比，尤其 Google 現在很掙扎。"],["They made transformers, they invented all the AI stuff years ago and they never really shipped.","Transformer 是他們做的，那些 AI 技術他們好幾年前就發明了，卻一直沒真正推出。"],["They could have shipped ChatGPT for example, I heard, in 2019. And they never shipped it because they were so stuck in bureaucracy.","我聽說他們 2019 年就能推出 ChatGPT 那樣的東西，卻始終沒推，因為深陷官僚流程。"],["But they had everything. They had the data, they had the tech, they had the engineers and they didn’t do it.","他們什麼都有：資料、技術、工程師，卻沒做。"],["And it’s because these big organizations, it can make you very slow.","原因是大組織會讓你變得很慢。"],["So being alone by myself on my laptop, in my underwear in a hotel room or something, I can ship very fast and I don’t need to ask legal for, “Oh, can you vouch for this?” I can just go and ship.","我一個人、一台筆電，穿著內褲待在飯店房間，就能很快出貨，不必去問法務「這個你能背書嗎？」。我直接上線就好。"]]}],
 sum:["他把「開公司」整件事拆掉，只留一個實驗：兩週內做出能收錢的東西。","判斷標準是有人付錢。註冊和稱讚都不算。","速度來自沒有資金、沒有人要請示。他把限制當成方法在用。"],
 core:"點子的價值在做出來之前無法得知，所以真正能經營的資產是「每次實驗的成本」。",
 chain:["沒有人能事先知道哪個點子會成。他自己也說多數失敗。","命中率不可控，可控的只剩兩件事：試幾次，每次花多少。","註冊和稱讚不花對方任何成本，所以幾乎不帶資訊。付錢要花成本，所以是誠實的訊號。","把每次實驗壓到「兩週加一個付款按鈕」，等於用最低的價格買到真話。"],
 ask:"你手上哪個點子，其實兩週內就能放上一個付款按鈕？你一直沒放，是在保護什麼？",
 q:"Pieter 不募資、一個人做。你猜他用什麼標準判斷一個點子「成立」？",opts:["很多人註冊試用","朋友和同行都說讚","陌生人掏錢付費","被科技媒體報導"],ans:2,key:[[1,5],[1,6]],
 counter:"「付錢才算驗證」對低單價工具成立。如果你的產品要靠信任累積才賣得動（顧問、社群、高單價），兩週內沒人付錢，可能只代表信任還沒到。你要怎麼分辨這兩種「沒人買」？"},
{id:"s2",t:325,title:"鏟沙",spark:"低潮時先去搬沙",
 turns:[
 {sp:"P",t:325,s:[null,["And he taught me, when I’m depressed for something, he says, “Get a big mountain of sand or something from construction, and just get a shovel and bring it to the other side and just do physical labor, do hard work, and do something, Set a goal, do something.”","我爸教我，心情低落的時候，他說：「去弄一大堆沙，工地那種，拿把鏟子把它鏟到另一邊。做體力活、做苦工、做點什麼。訂個目標，做點什麼。」"],["And I did that with startups too.","我做新創也是這樣。"]]},
 {sp:"P",t:374,s:[null,["But I think it’s very metaphorical for work, because I also … I never stop work.","我覺得這很像工作的隱喻，因為我也從不停工。"],["I go to the next website or I make a new one or I make a new startup.","我會去做下一個網站，或開一個新的，或再做一個新創。"],["It gives you something to wake up in the morning and have coffee and kiss your girlfriend and then you have a goal, “Today I’m going to fix this feature,” or “Today I’m going to fix this bug,” or something.","它讓你早上有理由起床：喝杯咖啡、親一下女友，然後你有個目標，「今天我要修好這個功能」或「今天我要解掉這個 bug」。"],["“I’m going to do something.” You have something to wake up to.","「我要做點什麼。」你有個值得醒來的東西。"],null]},
 {sp:"L",t:412,s:[["How much of the building that you do is about money? How much is it about just a deep internal happiness?","你做這些東西，有多少是為了錢？又有多少純粹是為了內心深處的快樂？"]]},
 {sp:"P",t:419,s:[["It’s really about fun, because I was doing it when I didn’t make money. That’s the point.","真的就是為了好玩，因為沒賺錢的時候我也在做。這才是重點。"],null,["So I think creative expression is a meaningful work that’s so important, it’s so fun.","我覺得創造性的表達是有意義的工作，非常重要，也非常好玩。"],["It’s so fun to have a daily challenge where you try to figure stuff out.","每天有個挑戰讓你去想辦法解開，真的很好玩。"]]}],
 sum:["父親的處方是低潮時別想，去搬沙。先動，情緒之後才跟上。","他把做產品當成同一件事：每天一個解得掉的小問題，就是起床的理由。","沒賺錢的時候他也在做。錢是後來的結果，當時推著他的是好玩。"],
 core:"動機是行動的副產品。等有動機才行動，順序反了。",
 chain:["低潮時腦袋想要一個有意義的大答案，而那正是低潮時給不出來的東西。","具體、做得完的任務不需要答案就能開始，做完還會回饋一點進度感。","進度感會生出下一步的動機，形成迴路。等動機來才動，迴路永遠不會啟動。","所以該設計的是「今天那堆沙」。人生方向可以晚點再說。"],
 ask:"你今天的「那堆沙」是什麼？小到不必想清楚就能開始的那一件。",
 q:"27 歲的 Pieter 月收 500 美元，躺在飯店看天花板，覺得自己是魯蛇。他爸給了什麼建議？",opts:["找個人好好聊一聊","回家休息一陣子","拿鏟子去搬沙，做體力活","先訂一個五年計畫"],ans:2,key:[[0,1]],
 counter:"「先動再說」對卡住的人有效。但對本來就動太多的人，它可能變成逃避：一直搬沙，就不必決定該搬哪一堆。你的問題是動不了，還是停不下來選？"},
{id:"s3",t:440,title:"不想當 CEO",spark:"募到幾億的人想學他",
 turns:[
 {sp:"L",t:440,s:[["But the interesting thing is you built a lot of successful products and you never really wanted to take it to that level where you scale real big and sell it to a company or something like this.","有趣的是，你做出很多成功的產品，卻從沒想把它推到那個層級：做到超大，再賣給某家公司之類的。"]]},
 {sp:"P",t:452,s:[null,["But I never raised funding for it. And I think because I don’t like the stressful life that comes with it.","我從沒為它募過資。我想是因為我不喜歡隨之而來的高壓生活。"],["I have a lot of founder friends and they tell me secretly, with hundreds of millions of dollars in funding and stuff, and they tell me, “Next time, if I’m going to do it, I’m going to do it like you, because it’s more fun, it’s more indie, it’s more chill, it’s more creative.”","我有很多創辦人朋友，募了幾億美元那種，他們私下跟我說：「下次如果再做，我要像你那樣做，因為更好玩、更獨立、更自在、更有創造力。」"],["They don’t like this. They don’t like to be manager, where you become a CEO, you become a manager.","他們不喜歡現在這樣。他們不喜歡當管理者。你當上 CEO，就變成了管理者。"],["And I think a lot of people that start startups, when they become a CEO, they don’t like that job actually, but they can’t really exit it, but they like to do the groundwork, the coding.","我覺得很多創業的人當上 CEO 之後，其實不喜歡那份工作，卻又抽不了身。他們喜歡的是第一線的活，是寫程式。"],["So I think that keeps you happy, doing something creative.","所以我想，讓你快樂的是持續做有創造性的事。"]]}],
 sum:["他不排斥用戶變多。他不要的是募資附帶的那種生活。","募到幾億的朋友私下說，下次想照他的方式做。","很多創辦人愛的是動手做，卻被升成管理者，而且退不出來。"],
 core:"規模是手段。你真正在最佳化的，是自己每天做什麼事。",
 chain:["公司變大，創辦人的工作內容會從創造變成管理。這是結構造成的，跟個人意願無關。","多數人創業的原始動機是創造。","所以「成功」會自動把人推離他開始的理由，除非事先選一個不需要那種規模的形態。","一人公司是對工作內容的選擇。營收多大是另一個變數。"],
 ask:"如果你的產品明年大成功，你每天的行事曆會長什麼樣子？你想要那份行事曆嗎？",
 q:"募到上億美元的創辦人朋友，私下對 Pieter 說了什麼？",opts:["你該募資把它做大","下次我想照你的方式做","你這樣賺不到大錢","一個人撐不了多久"],ans:1,key:[[1,2]],
 counter:"這是倖存者的視角。Pieter 能不募資，是因為他的產品邊際成本接近零，一個人寫得完。如果你的想法需要硬體、庫存或業務團隊，「保持小」可能等於做不成。你的點子屬於哪一種？"},
{id:"s4",t:920,title:"一個月的牆",spark:"難的是決定不做什麼",
 turns:[
 {sp:"P",t:920,s:[null,["It was a good idea to … every month launch a startup, so I could learn to code, learn basic stuff.","每個月推出一個新創是個好主意，這樣我可以學寫程式、學基本功。"],["But it was still very scrappy, which is on purpose, because I didn’t have time to spend a lot of … I had a month to do something, so I couldn’t spend more than a month and I was pretty strict about that.","但東西還是很粗糙，這是故意的。我只有一個月做一件事，所以不能超過一個月，這點我守得很嚴。"],["And I published it as a blog post. I think I put it on Hacker News and people would check, “Oh, did you actually …”","我把這個計畫寫成部落格文章發出去，好像還貼上了 Hacker News，大家會來看「欸，你真的有做嗎…」"],["I felt accountability because I put it public, that I actually had to do it.","因為公開了，我感受到責任，我真的得做到。"]]},
 {sp:"L",t:1104,s:[null,["What’s it take to build a thing in 30 days? At that time, how hard was that?","要在 30 天內做出一個東西，需要什麼？在當時，這有多難？"]]},
 {sp:"P",t:1117,s:[["I think the hard part is figuring out what you shouldn’t add, what you shouldn’t build, because you don’t have time.","我覺得難的是搞清楚什麼不該加、什麼不該做，因為你沒有時間。"],["So you need to build a landing page. Well, you need to build the product, actually, because there needs to be something they pay for.","你需要做一個到達頁。嗯，其實你得把產品做出來，因為總得有個東西讓人付錢。"],["Do you need to build a login system? Maybe no. Maybe you can build some scrappy login system.","你需要做登入系統嗎？也許不用。也許做個陽春的就好。"],["For photo AI, you sign up, you pay with Stripe Checkout and you get a login link.","像 Photo AI，你註冊、用 Stripe Checkout 付款，然後收到一個登入連結。"],null,["And now I have real Google login, but that took a year.","現在我有正式的 Google 登入了，但那是一年之後的事。"],["So keeping it very scrappy is very important to … because you don’t have time. You need to focus on what you can build fast.","所以保持粗糙非常重要，因為你沒有時間。你得專注在能快速做出來的東西上。"]]},
 {sp:"P",t:1157,s:[["So money, Stripe, build a product, build a landing page.","所以：金流、Stripe、做產品、做到達頁。"],["You need to think about, “How are people going to find this?”","你得想：「大家要怎麼找到這個東西？」"],null,["Maybe if you find a problem that a lot of people on Reddit already have, on a subreddit and you solve that problem, say, “What’s up, people. I made this thing that might solve your problem,” and maybe, “It’s free for now.” That could work.","如果你找到某個 subreddit 上很多人本來就有的問題，把它解決，然後說：「嗨各位，我做了個東西，也許能解決你們的問題」，再加一句「目前免費」。那可能行得通。"],["But you need to be very … Narrow it down, what you’re building.","但你得非常……把你要做的東西縮小、再縮小。"]]}],
 sum:["12 個月 12 個產品。期限是硬的，完成度可以讓步。","他把計畫公開發表，被人盯著，所以非做不可。","難的是決定不做什麼。正式的登入系統可以晚一年才補。"],
 core:"期限釘死之後，被犧牲的只能是範圍。砍範圍的過程會逼你找出產品的核心。",
 chain:["時間、範圍、完成度，三者只能固定兩個。","多數人固定範圍（「功能要完整才能上」），結果時間無限延長，永遠不上線。","把時間釘死，每個功能都得回答：沒有它，別人還會付錢嗎？","答案是「會」的功能都可以晚點做。剩下那一兩樣才是產品本體。"],
 ask:"你正在做的東西，哪個部分是你的「登入系統」：感覺一定要有，拿掉卻不影響別人付錢？",
 q:"30 天做出一個產品。Pieter 說最難的部分是什麼？",opts:["學會需要的技術","想到一個好點子","決定什麼不要做","找到第一批用戶"],ans:2,key:[[2,0]],
 counter:"一直砍，會不會砍出一堆半成品？12 個產品裡活下來的是少數。快的代價是，你可能在第 3 週放棄一個第 8 週才看得出價值的東西。哪一類點子不適合 30 天？"},
{id:"s5",t:9424,title:"兩分鐘修好",spark:"有人回報 bug，他按碼表",
 turns:[
 {sp:"L",t:9424,s:[["You often deploy it to production? You don’t have a testing ground?","你常常直接部署到正式環境？沒有測試環境？"]]},
 {sp:"P",t:9428,s:[["No. So, I’m famous for this because I’m too lazy to set up a staging server on my laptop every time.","沒有。我就是以這個出名的，因為我懶得每次都在筆電上架測試伺服器。"],["So, nowadays, I just deploy to production and man, I’m going to be canceled for this. But it works very well for me.","所以現在我就是直接部署到正式環境。天啊，講這個我會被罵翻。但這對我非常有效。"],null,["So, I don’t deploy, but literally, I have like 37,000 Git commits in the last 12 months or something.","說真的，過去 12 個月我大概有 37,000 次 Git commit。"],null]},
 {sp:"P",t:9473,s:[null,["But look, it’s idiotic in any big company. But for me it works because it makes me so fast.","你看，這在任何大公司都是白痴做法。但對我有效，因為它讓我非常快。"],["Somebody will report a bug on Twitter and I do a stopwatch.","有人在 Twitter 上回報 bug，我就按下碼表。"],["How fast can I fix this bug? And then, two minutes later, for example, it’s fixed.","我能多快修好這個 bug？然後，比方說兩分鐘後，修好了。"],["And it’s fun because it’s annoying for me to work with companies where you report a bug and it takes six months. It’s horrible.","這很好玩，因為我受不了跟那種回報 bug 要等六個月的公司合作。太可怕了。"],["And it makes people really happy when you can really quickly solve their problems. But it’s crazy.","當你能很快解決大家的問題，他們真的會很開心。但這很瘋。"]]},
 {sp:"P",t:9740,s:[["And the law can change.","而且法律是會變的。"],null,["So, just by shipping it, you change society, you change the legal framework.","光是把東西推出去，你就改變了社會、改變了法律框架。"],["By not shipping, being scared of the legal framework all the time, you’re not changing things.","不推出去、成天害怕法律框架，你什麼也改變不了。"]]}],
 sum:["沒有測試環境，改完直接上線，一年約 37,000 次 commit。","他承認這在大公司是白痴做法。對一個人來說，它換到的是速度。","用戶回報 bug，兩分鐘後修好。用戶直接感受到這個速度。"],
 core:"流程存在的理由是降低出錯的代價。出錯的代價本來就低的時候，流程只剩下成本。",
 chain:["測試環境、審核、法務，都是在買保險，防止一次錯誤造成大損失。","保險值多少錢，取決於損失有多大。大公司一次事故影響百萬人，一個人的產品壞兩分鐘，影響很小。","所以同一套流程，對大公司划算，對個人是純負擔。","小的優勢就在這裡：你可以用「很快修好」取代「事前預防」，而用戶感受得到前者。"],
 ask:"你現在哪個謹慎的流程，其實是從大公司搬來的習慣？它在保護你什麼損失？",
 q:"用戶在 Twitter 上回報 bug。Pieter 接下來會做什麼？",opts:["排進下週的待辦清單","按下碼表，看多快能修好","先在測試環境重現問題","回覆感謝，之後再處理"],ans:1,key:[[2,2],[2,3]],
 counter:"「壞了再修」只在錯誤可逆時成立。金流算錯、資料外洩、寄錯信給所有用戶，這些兩分鐘修不回來。你的產品裡，哪些地方不可逆，值得慢下來？"}
];

function follow(){
  let cur;try{cur=player.getCurrentTime()}catch(e){return}
  let hit=null;for(const tu of TURNS){if(tu.t<=cur+.3)hit=tu;else break}
  const i=hit?TURNS.indexOf(hit):-1,next=TURNS[i+1];
  if(hit&&!(next&&next.t-hit.t<150?cur<next.t:cur<hit.t+90))hit=null;
  const id=hit?hit.id:null;if(id===nowId)return;nowId=id;
  $$(".turn.now",rscroll).forEach(e=>e.classList.remove("now"));
  if(!id)return;const el=$(`[data-turn="${id}"]`,rscroll);if(!el)return;el.classList.add("now");
  if(Date.now()-lastUserScroll>4000)el.scrollIntoView({block:"center",behavior:"smooth"});
}

    <header><i>第 ${gi+1} 段，共 ${SEGS.length} 段</i><h3>${g.title}</h3>${tlink(g.t)}</header>
    ${g.turns.map((tu,ti)=>{const ids=tu.s.map((p,si)=>p?`${g.id}-${ti}-${si}`:null);const line=l=>ids.map(id=>id?span(id,l):`<span class="gap">[…]</span>`).join(l==="en"?" ":"");
      return `<div class="turn sp-${tu.sp}" data-turn="${g.id}-${ti}"><div class="who"><b>${tu.sp==="L"?"LEX FRIDMAN":"PIETER LEVELS"}</b>${tlink(tu.t)}</div><p class="zh">${line("zh")}</p><p class="en" lang="en">${line("en")}</p></div>`}).join("")}
    <div class="absorb">
      <div class="eyebrow">這一段在說什麼</div><ul>${g.sum.map(x=>`<li>${x}</li>`).join("")}</ul>
      <div class="eyebrow">第一性原理</div><p class="core">${g.core}</p>
      <details><summary>展開推理鏈（${g.chain.length} 步）</summary><ol class="chain">${g.chain.map(x=>`<li>${x}</li>`).join("")}</ol></details>
      <div class="eyebrow">換到你身上</div><p class="ask">${g.ask}</p>
      <textarea id="refl-${g.id}" data-refl="${g.id}" placeholder="寫一兩句就好">${esc(S.refl[g.id]||"")}</textarea>
    </div></section>`).join("")+`</div>`;
  rscroll.scrollTop=top;nowId=null;
  $$("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
}
function markSent(id){$$(`.s[data-id="${id}"]`,rscroll).forEach(e=>{e.dataset.hl=S.hl[id]||"";e.classList.toggle("has-note",!!S.notes[id])})}
function sentSheet(id){
  const s=SENT[id];$$(`.s[data-id="${id}"]`,rscroll).forEach(e=>e.classList.add("on"));
  openSheet(`<p class="q-zh">${esc(s.zh)}</p><p class="q-en" lang="en">${esc(s.en)}</p>
    <div class="hl-row">${[["y","洞見","var(--hl-y)"],["p","疑問","var(--hl-p)"],["g","要去做","var(--hl-g)"],["","不畫","transparent"]].map(([k,l,c])=>`<button data-hl="${k}" aria-pressed="${(S.hl[id]||"")===k}"><i style="background:${c}"></i>${l}</button>`).join("")}</div>
    <textarea id="a-note" placeholder="這句讓你想到什麼？">${esc(S.notes[id]||"")}</textarea>
    <div class="ai-out" id="a-aiout" hidden></div>
    <div class="row">${tlink(s.t,"▶ 從這段播放 "+fmt(s.t))}<span class="sp"></span><button class="btn sm ghost ai-only" id="a-ask">請 AI 解釋這句</button><button class="btn sm" id="a-done">完成</button></div>`,
    ()=>{$$(".s.on",rscroll).forEach(e=>e.classList.remove("on"));if(ui.side!=="overview")renderSide()});
  $$("[data-hl]",sheetEl).forEach(b=>b.onclick=()=>{const k=b.dataset.hl;if(k)S.hl[id]=k;else delete S.hl[id];commit();markSent(id);$$("[data-hl]",sheetEl).forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#a-note").oninput=e=>{const v=e.target.value;if(v.trim()){S.notes[id]=v;if(!S.hl[id])S.hl[id]="y"}else delete S.notes[id];commit();markSent(id)};
  $("#a-done").onclick=closeSheet;
  $("#a-ask").onclick=e=>askAI(`你是陪讀夥伴。讀者的母語是繁體中文，是一位創業者，正在讀一段英文訪談逐字稿。請用繁體中文、最多 90 個字，解釋下面這句話在上下文中的意思，並點出它背後的一個假設。直接講，不要開場白，不要條列。\n\n這段的主題：${s.seg.title}\n上下文：${s.turn.s.filter(Boolean).map(p=>p[0]).join(" ")}\n要解釋的句子：${s.en}`,$("#a-aiout"),e.currentTarget);
}
rscroll.addEventListener("click",e=>{const s=e.target.closest(".s");if(s)sentSheet(s.dataset.id)});
rscroll.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList.contains("s"))sentSheet(e.target.dataset.id)});
rscroll.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.refl;if(k){S.refl[k]=e.target.value;commit()}});
$$("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;commit();rscroll.className="scroll m-"+S.mode;$$("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===b))});

/* ---------- overview ---------- */
const segsIn=i=>SEGS.filter(g=>g.t>=CH[i].t&&(i===CH.length-1||g.t<CH[i+1].t));
function renderOverview(){
  const list=CH.map((c,i)=>({c,i,segs:segsIn(i)})).filter(x=>!ui.coreOnly||x.c.worth===3);
  side.innerHTML=`<div class="pad ov">
    <div class="eyebrow">3 小時 44 分 · ${CH.length} 個章節 · Lex Fridman Podcast #440</div>
    <p class="thesis">${THESIS}</p>
    <h2>Pieter Levels: Programming, Viral AI Startups, and Digital Nomad Life</h2>
    <ul>${TLDR.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="row"><div class="eyebrow" style="flex:1">章節</div><div class="chips"><button data-core="0" aria-pressed="${!ui.coreOnly}">全部</button><button data-core="1" aria-pressed="${ui.coreOnly}">只看核心</button></div></div>
    <div class="chs">${list.map(({c,i,segs})=>`<article class="ch w${c.worth}">
      <header><b><span class="t">${esc(c.zh)}</span><small>${esc(c.en)}</small></b><span class="w w${c.worth}">${["","可跳過","值得看","核心"][c.worth]}</span>${tlink(c.t)}</header>
      <p>${esc(c.sum)}</p>${c.take?`<p class="take">→ ${esc(c.take)}</p>`:""}
      <div class="row">${segs.map(g=>`<button class="btn sm" data-seg="${g.id}">精讀「${g.title}」</button>`).join("")||`<a class="btn sm ghost" data-t="${c.t}" data-goread href="${yt(c.t)}" target="_blank" rel="noopener">播放這一章</a>`}</div>
    </article>`).join("")}</div>
    <p class="meta">這份試作只把 5 段展開成逐字稿。其餘章節的摘要讀的是完整逐字稿，可以直接播放。</p></div>`;
}

/* ---------- distill ---------- */
function sparks(){const out=[];SEGS.forEach(g=>{out.push({id:"ai-"+g.id,seg:g,ai:true,text:g.spark,t:SENT[keyIds(g)[0]].t});
  Object.keys(S.hl).filter(id=>SENT[id]&&SENT[id].seg===g).sort().forEach(id=>out.push({id,seg:g,text:SENT[id].zh,hl:S.hl[id],t:SENT[id].t}))});return out}
const lvName=n=>n>=3?"樹":n===2?"芽":"種子";
const liveEv=c=>{const ids=new Set(sparks().map(s=>s.id));return c.ev.filter(e=>ids.has(e))};
function renderDistill(){
  const sp=sparks(),used=new Set(S.claims.flatMap(c=>c.ev)),lt=ui.linkTo&&S.claims.find(c=>c.id===ui.linkTo);
  let h="",last=null;
  sp.forEach(s=>{if(s.seg!==last){h+=`<div class="dlab">${s.seg.title}</div>`;last=s.seg}
    h+=`<button class="spark${used.has(s.id)?" used":""}${lt&&lt.ev.includes(s.id)?" pick":""}" data-spark="${s.id}" data-hl="${s.hl||""}"><small>${fmt(s.t)} · ${s.ai?"AI 挑的":"你畫的"}</small><span>${esc(s.text)}</span></button>`});
  side.innerHTML=(lt?`<div class="banner"><span>點左邊的火花，加入或移除證據</span><button class="btn sm" id="d-done">完成</button></div>`:"")+
    `<div class="dmap" id="dmap"><svg id="dsvg"></svg><div class="dcol"><div class="eyebrow">火花 ${sp.length}</div>${h}</div>
    <div class="dright" id="dright"><div class="eyebrow">我的主張 ${S.claims.length}</div>${S.claims.length?"":`<div class="dempty">點左邊任何一個火花，寫下你的第一個主張</div>`}
    ${S.claims.map(c=>{const n=liveEv(c).length,card=S.cards.some(k=>k.claim===c.id);return `<button class="claim lv${Math.min(3,Math.max(1,n))}${card?" carded":""}${ui.linkTo===c.id?" pick":""}" data-claim="${c.id}"><small>${card?"已成卡 · ":""}${lvName(n)} · ${n} 個證據</small>${esc(c.text)}</button>`}).join("")}</div></div>`;
  requestAnimationFrame(layoutDistill);
}
function layoutDistill(){
  const map=$("#dmap");if(!map)return;const right=$("#dright"),mr=map.getBoundingClientRect(),rr=right.getBoundingClientRect();
  const mid=el=>{const r=el.getBoundingClientRect();return {x:r.right-mr.left,y:r.top-mr.top+r.height/2}};
  const items=S.claims.map(c=>{const el=$(`[data-claim="${c.id}"]`,map),ev=liveEv(c).map(id=>$(`[data-spark="${id}"]`,map)).filter(Boolean).map(mid);
    const want=ev.length?ev.reduce((a,p)=>a+p.y,0)/ev.length:60;return {c,el,ev,want,h:el.offsetHeight}}).sort((a,b)=>a.want-b.want);
  let y=34;const off=rr.top-mr.top;
  items.forEach(it=>{const top=Math.max(y,it.want-off-it.h/2);it.el.style.top=top+"px";it.cy=top+off+it.h/2;y=top+it.h+22});
  right.style.minHeight=y+"px";
  const lx=rr.left-mr.left;
  $("#dsvg").innerHTML=items.flatMap(it=>it.ev.map(p=>`<path d="M${p.x} ${p.y} C${(p.x+lx)/2} ${p.y} ${(p.x+lx)/2} ${it.cy} ${lx} ${it.cy}"/>`)).join("");
}
window.addEventListener("resize",()=>{if(ui.side==="distill")layoutDistill()});
function sparkSheet(id){
  const s=sparks().find(x=>x.id===id);if(!s)return;const g=s.seg,q=s.ai?keyIds(g).map(i=>SENT[i]):[SENT[id]];
  openSheet(`<div class="eyebrow">火花 · ${g.title}</div><p class="q-en" lang="en" style="color:var(--ink)">${q.map(x=>esc(x.en)).join(" ")}</p><p class="q-zh" style="font-size:17px;font-weight:400;color:var(--mute)">${q.map(x=>esc(x.zh)).join("")}</p>
    ${!s.ai&&S.notes[id]?`<p style="margin:0;font-weight:700">✎ ${esc(S.notes[id])}</p>`:""}
    <div class="row">${tlink(q[0].t,"▶ 從這段播放 "+fmt(q[0].t))}</div>
    <details><summary>這一段的第一性原理</summary><p style="margin:8px 0 0">${g.core}</p></details>
    ${S.claims.length?`<div class="eyebrow">當成哪個主張的證據？</div><div class="linked">${S.claims.map(c=>`<button data-toggle="${c.id}" aria-pressed="${c.ev.includes(id)}"><span>${esc(c.text)}</span><span class="x">${c.ev.includes(id)?"✓":"＋"}</span></button>`).join("")}</div>`:""}
    <div class="eyebrow">${S.claims.length?"或者寫一個新主張":"這讓你想主張什麼？"}</div><textarea id="d-new" placeholder="用你會對朋友講的方式寫一句"></textarea>
    <div class="row"><span class="sp"></span><button class="btn" id="d-plant" disabled>種下去</button></div>`,renderDistill);
  const ta=$("#d-new");ta.oninput=()=>$("#d-plant").disabled=ta.value.trim().length<4;
  $("#d-plant").onclick=()=>{S.claims.push({id:"k"+Date.now().toString(36),text:ta.value.trim(),ev:[id]});commit();closeSheet();toast("種下了一顆種子")};
  $$("[data-toggle]",sheetEl).forEach(b=>b.onclick=()=>{const c=S.claims.find(x=>x.id===b.dataset.toggle),on=c.ev.includes(id);c.ev=on?c.ev.filter(e=>e!==id):[...c.ev,id];commit();b.setAttribute("aria-pressed",!on);b.lastElementChild.textContent=on?"＋":"✓"});
}
function claimSheet(cid){
  const c=S.claims.find(x=>x.id===cid);if(!c)return;const sp=sparks(),ev=liveEv(c).map(id=>sp.find(s=>s.id===id)),n=ev.length;
  openSheet(`<div class="eyebrow">我的主張 · ${lvName(n)} · ${n} 個證據</div><textarea id="d-edit">${esc(c.text)}</textarea>
    <div class="linked">${ev.map(s=>`<div><span>${esc(s.text)}</span><button class="x" data-unlink="${s.id}" aria-label="移除證據">×</button></div>`).join("")||`<div><span style="color:var(--mute)">還沒有證據</span></div>`}</div>
    <p style="margin:0;font-size:15px;color:var(--mute)">${n>=2?"證據夠了，可以鑄成觀點卡。每支影片最多留 "+MAXC+" 張。":"再連 "+(2-n)+" 個證據，就能鑄成觀點卡。"}</p>
    <div class="row"><button class="btn line sm" id="d-del">刪除</button><button class="btn line sm" id="d-add">加證據</button><span class="sp"></span><button class="btn" id="d-mint" ${n>=2?"":"disabled"}>鑄成觀點卡</button></div>`,renderDistill);
  $("#d-edit").oninput=e=>{c.text=e.target.value;commit()};
  $("#d-add").onclick=()=>{ui.linkTo=cid;closeSheet()};
  $("#d-del").onclick=()=>{S.claims=S.claims.filter(x=>x.id!==cid);commit();closeSheet()};
  $("#d-mint").onclick=()=>mintSheet(cid);
  $$("[data-unlink]",sheetEl).forEach(b=>b.onclick=()=>{c.ev=c.ev.filter(e=>e!==b.dataset.unlink);commit();claimSheet(cid)});
}
function mintSheet(cid){
  const c=S.claims.find(x=>x.id===cid),sp=sparks(),ev=liveEv(c).map(id=>sp.find(s=>s.id===id));
  const tally={};ev.forEach(s=>tally[s.seg.id]=(tally[s.seg.id]||0)+1);const g=SEGS.find(x=>x.id===Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0]);
  const others=S.cards.filter(k=>k.claim!==cid),full=others.length>=MAXC;let revised=false;
  openSheet(`<div class="eyebrow">鑄卡之前，先過反方這一關</div><textarea id="m-text">${esc(c.text)}</textarea>
    <div class="counter"><b>反方會說</b>${g.counter}</div><div class="ai-out" id="m-ai" hidden></div>
    <button class="btn sm ghost ai-only" id="m-live" style="align-self:flex-start">針對我這句話再反駁一次</button>
    ${full?`<div class="eyebrow">已經有 ${MAXC} 張了。換掉哪一張？</div><div class="linked">${others.map((k,i)=>`<button data-swap="${k.id}" aria-pressed="${i===0}"><span>${esc(k.text)}</span></button>`).join("")}</div>`:""}
    <div class="row"><span style="font-size:15px;color:var(--mute);flex:1">改了句子會標成「修正過」。</span><button class="btn" id="m-go">${full?"換掉並收成卡片":"收成卡片"}</button></div>`,renderDistill);
  let swap=full?others[0].id:null;
  $$("[data-swap]",sheetEl).forEach(b=>b.onclick=()=>{swap=b.dataset.swap;$$("[data-swap]",sheetEl).forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#m-text").oninput=e=>{c.text=e.target.value;revised=true;commit()};
  $("#m-live").onclick=e=>askAI(`你是嚴格但友善的辯論對手。讀者看完一段訪談，用自己的話寫下一個主張。請用繁體中文、最多 100 個字，指出這個主張最弱的一個環節（一個具體反例，或一個沒說出口的假設），最後用一個問題結尾。不要稱讚，不要重述他的話，不要條列。\n\n訪談重點：${g.sum.join(" ")}\n他引用的證據：${ev.map(s=>s.text).join("；")}\n讀者的主張：${c.text}`,$("#m-ai"),e.currentTarget);
  $("#m-go").onclick=()=>{if(c.text.trim().length<4)return;
    S.cards=S.cards.filter(k=>k.claim!==cid&&k.id!==swap);const card={id:"c"+Date.now().toString(36),claim:cid,text:c.text.trim(),ev:liveEv(c),revised,at:Date.now()};S.cards.push(card);commit();
    ui.fresh=card.id;closeSheet();toast("得到一張觀點卡");setTab("cards")};
}

/* ---------- cards ---------- */
function evQuote(id){if(id.startsWith("ai-")){const g=SEGS.find(x=>"ai-"+x.id===id);const q=keyIds(g).map(i=>SENT[i]);return {en:q.map(x=>x.en).join(" "),zh:q.map(x=>x.zh).join(""),t:q[0].t}}return SENT[id]}
function renderCards(){
  const cards=S.cards,names={y:"洞見",p:"疑問",g:"要去做"};
  const post=cards.length?`看完 Lex Fridman 訪 Pieter Levels（#440），我只留下這 ${cards.length} 句：\n\n`+cards.map((k,i)=>`${i+1}. ${k.text}`).join("\n\n"):"";
  const hl=Object.keys(S.hl).filter(id=>SENT[id]).sort((a,b)=>SENT[a].t-SENT[b].t||a.localeCompare(b)),refl=SEGS.filter(g=>(S.refl[g.id]||"").trim());
  side.innerHTML=`<div class="pad"><div><div class="eyebrow">這支影片最多留 ${MAXC} 張</div><h2>${cards.length?"這些句子是你寫的。":"還沒有觀點卡。"}</h2></div>
    ${cards.map(k=>`<div class="vcard${ui.fresh===k.id?" mint":""}"><div class="row"><span class="tag">${k.revised?"修正過":"原句過關"}</span><span class="sp"></span><button data-drop="${k.id}">移除</button></div><p>${esc(k.text)}</p>
      ${k.ev.map(evQuote).filter(Boolean).filter((q,i,a)=>!a.some((o,j)=>j!==i&&o.en.includes(q.en)&&(o.en.length>q.en.length||j<i))).slice(0,3).map(q=>`<div class="ev" lang="en">${esc(q.en)} ${tlink(q.t)}</div>`).join("")}</div>`).join("")}
    ${Array.from({length:MAXC-cards.length},(_,i)=>`<div class="slot">${i===0&&!cards.length?"到「淬煉」把火花連成主張，有 2 個證據就能鑄成卡片。":"空位"}</div>`).join("")}
    ${cards.length?`<div class="eyebrow">組成貼文</div><textarea class="big" id="c-post">${esc(post)}</textarea><div class="ai-out" id="c-ai" hidden></div>
      <div class="row"><button class="btn" id="c-copy">複製</button><button class="btn ghost ai-only" id="c-polish">請 AI 順成一篇貼文</button></div>`:""}
    <details><summary>全部筆記（畫線 ${hl.length} · 回答 ${refl.length}）</summary><div style="display:grid;gap:8px;margin-top:10px">
      ${refl.map(g=>`<div class="ncard"><small>我對「${g.title}」的回答</small><span class="mine">${esc(S.refl[g.id])}</span></div>`).join("")}
      ${hl.map(id=>{const s=SENT[id];return `<div class="ncard" data-hl="${S.hl[id]}"><small>${names[S.hl[id]]} · ${tlink(s.t)}</small><span>${esc(s.zh)}</span><span class="q-en" style="font-size:17px" lang="en">${esc(s.en)}</span>${S.notes[id]?`<span class="mine">✎ ${esc(S.notes[id])}</span>`:""}</div>`}).join("")||""}
    </div></details></div>`;
  ui.fresh=null;
}

/* ---------- shell ---------- */
function meta(){
  const h=Object.keys(S.hl).length,r=Object.values(S.refl).filter(v=>v&&v.trim()).length,k=S.claims.length,c=S.cards.length;
  const done=[h>=3,r>=1,k>=1,c>=1,c>=MAXC];
  $("#pips").innerHTML=done.map(d=>`<i class="${d?"on":""}"></i>`).join("");
  $("#n-d").textContent=k||"";$("#n-c").textContent=c?c+"/"+MAXC:"";
  const st=$("#steps");st.hidden=ui.side!=="distill";
  st.innerHTML=[["畫線 "+h,h>=1],["寫主張 "+k,k>=1],["連 2 個證據",S.claims.some(x=>liveEv(x).length>=2)],["鑄卡 "+c+"/"+MAXC,c>=1]].map(([t,on],i)=>`<span class="${on?"on":""}">${i+1} ${t}</span>`).join("");
}
function renderSide(){({overview:renderOverview,distill:renderDistill,cards:renderCards})[ui.side]();meta();
  $$("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===(ui.m==="read"?"read":ui.side)));root.dataset.m=ui.m}
function setTab(t){closeSheet();const prev=ui.side;if(t==="read")ui.m="read";else{ui.m="side";ui.side=t}if(t!=="distill")ui.linkTo=null;renderSide();if(t!=="read"&&t!==prev)side.scrollTop=0}
function renderAll(){renderRead();renderSide()}
$("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab)};
side.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.core!=null){ui.coreOnly=t.dataset.core==="1";renderOverview()}
  else if(t.dataset.seg){setTab("read");const el=$("#seg-"+t.dataset.seg);el&&el.scrollIntoView({block:"start"});lastUserScroll=Date.now()}
  else if(t.id==="d-done"){ui.linkTo=null;renderDistill()}
  else if(t.dataset.spark){if(ui.linkTo){const c=S.claims.find(x=>x.id===ui.linkTo),id=t.dataset.spark;c.ev=c.ev.includes(id)?c.ev.filter(x=>x!==id):[...c.ev,id];commit();renderDistill()}else sparkSheet(t.dataset.spark)}
  else if(t.dataset.claim){if(ui.linkTo){ui.linkTo=null;renderDistill()}else claimSheet(t.dataset.claim)}
  else if(t.dataset.drop){S.cards=S.cards.filter(k=>k.id!==t.dataset.drop);commit();renderCards()}
  else if(t.id==="c-copy")copyText($("#c-post"));
  else if(t.id==="c-polish")askAI(`把下面這位讀者自己寫的結論整理成一篇繁體中文社群貼文，250 字以內。規則：只能使用他寫的觀點，不能加入新論點；保留他的口吻；不要勵志結尾，不要 hashtag，不要 emoji。\n\n${$("#c-post").value}`,$("#c-ai"),t);
});
renderAll();initYT();
</script>
